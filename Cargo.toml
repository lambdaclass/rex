[workspace]
members = ["cli", "sdk"]
default-members = ["cli"]
resolver = "3"

[workspace.package]
version = "24.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/lambdaclass/rex"
authors = ["Lambdaclass"]

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "warn"

[workspace.lints.clippy]
panic = "deny"
unnecessary_cast = "warn"
deref_by_slicing = "warn"
indexing_slicing = "warn"
manual_unwrap_or = "warn"
manual_unwrap_or_default = "warn"
as_conversions = "deny"
unwrap_used = "deny"
expect_used = "deny"
arithmetic_side_effects = "deny"
overflow_check_conditional = "warn"
manual_saturating_arithmetic = "warn"

[workspace.dependencies]
rex-cli = { path = "cli" }
rex-sdk = { path = "sdk" }

# Track ethrex's frames-devnet-0 branch so rex's frame-tx support stays in lockstep
# with the wire format that chain actually speaks. The published 24.0.0 crates
# predate EIP-8141's two-dimensional gas limits, so a rex built against them emits
# a flat `gas_limit` and the node rejects it while decoding `limits`.
ethrex-common = { git = "https://github.com/lambdaclass/ethrex", branch = "frames-devnet-0" }
ethrex-blockchain = { git = "https://github.com/lambdaclass/ethrex", branch = "frames-devnet-0" }
ethrex-rlp = { git = "https://github.com/lambdaclass/ethrex", branch = "frames-devnet-0" }
ethrex-rpc = { git = "https://github.com/lambdaclass/ethrex", branch = "frames-devnet-0" }
ethrex-l2-rpc = { git = "https://github.com/lambdaclass/ethrex", branch = "frames-devnet-0" }
ethrex-sdk = { git = "https://github.com/lambdaclass/ethrex", branch = "frames-devnet-0" }
ethrex-l2-common = { git = "https://github.com/lambdaclass/ethrex", branch = "frames-devnet-0" }

keccak-hash = "0.11.0"
thiserror = "2.0.11"
hex = "0.4.3"
secp256k1 = { version = "0.30.0", default-features = false, features = [
  "global-context",
  "recovery",
  "rand",
] }
rayon = "1.10.0"
